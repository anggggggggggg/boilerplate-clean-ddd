# Working directory
root = "."
testdata_dir = "test"
tmp_dir = "/tmp/boilerplate"

[build]
  # Arguments to pass to `go build`
  args_bin = []
  
  # Binary file name
  bin = "/tmp/boilerplate/boilerplate"
  
  # Command to build
  cmd = "go build -buildvcs=false -o /tmp/boilerplate/boilerplate ./cmd/server"
  
  # Delay after receiving events to trigger build (ms)
  delay = 1000
  
  # Exclude directories
  exclude_dir = ["deploy", "bin", ".dist", "vendor", "tmp", ".git", ".vscode", ".idea"]
  
  # Exclude files
  exclude_file = []
  
  # Exclude unchanged files
  exclude_unchanged = true
  
  # Exclude regex pattern
  exclude_regex = ["_test\\.go"]
  
  # Follow symbolic links
  follow_symlink = false
  
  # Full build command (overrides cmd, bin, etc.)
  full_bin = "/tmp/boilerplate/boilerplate"
  
  # Include directories
  include_dir = []
  
  # Include extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  
  # Include files — pantau perubahan config juga
  include_file = [".config.yml"]
  
  # Kill delay (ms) - time to wait after sending interrupt
  kill_delay = 500
  
  # Log file (empty = stdout — penting agar log muncul di `docker logs`)
  log = ""
  
  # Poll for changes instead of using fsnotify
  # Wajib true di dalam Docker: inotify pada mounted volume tidak reliable di semua platform
  poll = true
  
  # Poll interval (ms)
  poll_interval = 500
  
  # Rerun binary after crash
  rerun = false
  
  # Delay after build error before attempting rebuild (ms)
  rerun_delay = 500
  
  # Send interrupt signal before killing process
  send_interrupt = true
  
  # Stop running old binary when build errors occur
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  # Show log time
  time = true
  
  # Log level: debug, info, warn, error
  level = "debug"

[misc]
  # Clean tmp directory on exit
  clean_on_exit = true

[screen]
  # Clear console on rebuild
  clear_on_rebuild = true
  
  # Keep scroll position after rebuild
  keep_scroll = true
